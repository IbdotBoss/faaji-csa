<style>

  .q{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 22px 18px;margin:14px 0;box-shadow:var(--shadow);transition:box-shadow .18s ease,border-color .18s ease}

  .badge.fail{background:var(--bad-bg);color:var(--bad);border-color:#fecaca}

  .explain.show{display:block}
  .explain.ok{border-color:#bbf7d0;background:linear-gradient(180deg,#f0fdf4,#ecfdf5)}
  .explain.bad{border-color:#fecaca;background:linear-gradient(180deg,#fef2f2,#fff5f5);color:#7f1d1d}
  #sticky{position:fixed;left:0;right:0;bottom:0;background:rgba(245,242,237,.78);backdrop-filter:blur(14px) saturate(140%);border-top:1px solid var(--border);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;z-index:40}

  .stat strong{color:var(--ink);font-weight:600}
  .done #sticky{background:rgba(245,242,237,.92)}

</style>

ntifies and resolves duplicate or conflicting CI records from multiple data sources", "Increases network packet volume for CI discovery", "Controls Linux log rotation"], "c": [1], "e": ""}, {"d": "Database Management and Platform Security", "t": "What is the Security Center (formerly Instance Security Center) used for?", "type": "sng", "opts": ["A marketplace for approved security plugins", "A tool for scanning Update Sets for malicious scripts before commit", "A consolidated dashboard for monitoring instance security compliance, viewing security events, configuring hardening settings, and managing user sessions", "A report generator for PCI audit evidence only"], "c": [2], "e": ""}, {"d": "Database Management and Platform Security", "t": "What is the Daily Compliance Score in the Security Center?", "type": "sng", "opts": ["A count of failed login attempts in the last 24 hours", "The percentage of incidents resolved within SLA targets in the past day", "A percentage score indicating how compliant the instance's security property settings are with recommended hardening guidelines", "A daily export of the instance's ACL configuration"], "c": [2], "e": ""}, {"d": "Database Management and Platform Security", "t": "What does the Shared Responsibility Model mean in the context of ServiceNow cloud security?", "type": "sng", "opts": ["ServiceNow and the customer split all security responsibilities 50/50", "ServiceNow is responsible for securing the cloud platform infrastructure; the customer is responsible for configuring and securing their instance (data, access controls, integrations, customizations)", "The customer is fully responsible for all security, including the underlying cloud hardware", "ServiceNow handles all instance security automatically with no customer action required"], "c": [1], "e": ""}, {"d": "Data Migration and Integration", "t": "Which record types are automatically captured by the current Update Set? *(Choose 2)*", "type": "sng", "opts": ["Business rules", "User password records", "Incident task data", "UI policies"], "c": [], "e": ""}, {"d": "Data Migration and Integration", "t": "Which capabilities are associated with compare tools for conflict resolution? *(Choose 2)*", "type": "sng", "opts": ["Rollback update set", "Show update history", "Identify duplicate or competing records", "Preview local and remote sets", "Scan Update Set"], "c": [], "e": ""}, {"d": "Data Migration and Integration", "t": "What is an Update Set?", "type": "sng", "opts": ["Containers for configuration changes that track changes to tables", "A data archival utility for CMDB records", "A mechanism for cloning entire instances", "A runtime engine for Workflow Studio executions"], "c": [0], "e": ""}, {"d": "Data Migration and Integration", "t": "Which tasks does a user perform when inspecting and reporting on Update Sets? *(Choose 2)*", "type": "sng", "opts": ["Export Update Sets to CSV", "Compare content with the target instance to spot conflicts", "Review the Update Set Logs table", "Browse included updates and drill into individual records"], "c": [], "e": ""}, {"d": "Data Migration and Integration", "t": "What does Instance Scan evaluate? *(Choose 2)*", "type": "sng", "opts": ["License consumption tiers", "User login frequency", "SLA breach counts", "Risk patterns", "Best practice violations"], "c": [], "e": ""}, {"d": "Data Migration and Integration", "t": "Which components does an Update Set contain? *(Choose 2)*", "type": "sng", "opts": ["Status and metadata for retrieval, preview, and commit", "MID Server connection details", "Plugin activation history", "The configuration deltas", "User session audit logs"], "c": [], "e": ""}, {"d": "Data Migration and Integration", "t": "What is the purpose of merging Update Sets in ServiceNow?", "type": "sng", "opts": ["Convert XML to JSON before import", "Create a parent with scoped children for a release", "Combine records from several sets into a single set", "Link Update Sets across instances for real-time sync"], "c": [2], "e": ""}, {"d": "Data Migration and Integration", "t": "What action do administrators perform when inspecting an Update Set?", "type": "sng", "opts": ["View differences against current versions", "Export user roles to CSV", "Run a full instance clone", "Trigger discovery schedules"], "c": [0], "e": ""}, {"d": "Data Migration and Integration", "t": "Which action is explicitly warned against because it can damage the system?", "type": "sng", "opts": ["Exporting an Update Set to XML", "Setting an Update Set to Complete", "Rolling back from the Default Update Set", "Viewing differences against current versions"], "c": [2], "e": ""}, {"d": "Data Migration and Integration", "t": "Which format is used to represent Update Sets?", "type": "sng", "opts": ["XML", "CSV", "JSON", "YAML"], "c": [0], "e": ""}, {"d": "Data Migration and Integration", "t": "What is the correct order of steps for moving a Completed Update Set between instances?", "type": "sng", "opts": ["Export from A → Import/Retrieve into B → Preview in B → Commit in B", "Export/Retrieve from A → Commit in B → Preview in B → Import into B", "Import into A → Commit in B → Preview in B → Export in B", "Retrieve from A → Commit in B → Preview in B → Import in B"], "c": [0], "e": ""}, {"d": "Data Migration and Integration", "t": "Which activity is an ideal use of Update Sets?", "type": "sng", "opts": ["Migrating incident data between instances", "Storing and applying specific versions of application configurations", "Managing user passwords across instances", "Scheduling discovery scans"], "c": [1], "e": ""}, {"d": "Data Migration and Integration", "t": "Which is listed as a component contained within an Update Set?", "type": "sng", "opts": ["Attachment binaries embedded in records", "User session tokens", "The records changed, stored as update records", "MID Server credentials"], "c": [2], "e": ""}, {"d": "Data Migration and Integration", "t": "What is the purpose of marking an Update Set as \"Ignore\" in production after committing?", "type": "sng", "opts": ["To remove it from the history of changes", "To automatically roll back its changes", "To prevent reapplication during a future retrieve", "To compress its XML for storage"], "c": [2], "e": ""}, {"d": "Data Migration and Integration", "t": "What is the scripting language used in ServiceNow?", "type": "sng", "opts": ["Java", "AngularJS", "JavaScript", "Jelly"], "c": [2], "e": ""}, {"d": "Data Migration and Integration", "t": "What is a Business Rule in ServiceNow?", "type": "sng", "opts": ["A server-side script that runs when a record is displayed, inserted, updated, deleted, or when a table is queried", "A client-side script that validates fields before form submission", "A scheduled job that runs on a defined interval", "A configuration record that defines escalation paths"], "c": [0], "e": ""}, {"d": "Data Migration and Integration", "t": "A Business Rule is configured with \"When = before\" and \"Insert = true\". When exactly does it execute?", "type": "sng", "opts": ["Before the form is displayed to the user", "After the user submits the form and after the record is saved", "After the user submits the form but before the record is saved to the database", "Only when triggered manually by a script"], "c": [2], "e": ""}, {"d": "Data Migration and Integration", "t": "Which of the following are valid \"When\" settings for a Business Rule? *(Choose 2)*", "type": "sng", "opts": ["Before", "Inline", "After", "On Submit"], "c": [], "e": ""}, {"d": "Data Migration and Integration", "t": "What are the predefined global variables available in a Business Rule? *(Choose 2)*", "type": "sng", "opts": ["`current` — represents the current state of the record being acted on", "`g_form` — the client-side form object", "`previous` — the state of the record before the current transaction (update/delete only)", "`window` — the browser window object"], "c": [], "e": ""}, {"d": "Data Migration and Integration", "t": "What is a UI Policy in ServiceNow?", "type": "sng", "opts": ["A server-side rule that enforces mandatory fields at the database level", "A no-code browser-side configuration that dynamically controls form field behavior (mandatory, read-only, hidden) based on conditions", "A policy that defines which users can access a specific module", "A visual theme setting applied to the Service Portal"], "c": [1], "e": ""}, {"d": "Data Migration and Integration", "t": "What is the key difference between a UI Policy and a Data Policy?", "type": "sng", "opts": ["UI Policies apply only in the browser (forms); Data Policies enforce field rules at the database level and apply regardless of access method (forms, imports, APIs)", "UI Policies are server-side; Data Policies are client-side", "UI Policies apply to all tables; Data Policies apply only to custom tables", "UI Policies set field visibility; Data Policies set record-level security"], "c": [0], "e": ""}, {"d": "Data Migration and Integration", "t": "What is a Script Include in ServiceNow?", "type": "sng", "opts": ["A tag that embeds an external JavaScript file into a form page", "A client-side script that runs on every page load", "A reusable server-side JavaScript library callable from business rules, other scripts, and client scripts via GlideAjax", "A scheduled script that executes daily"], "c": [2], "e": ""}];

const wrap=document.getElementById('qwrap');
const prog=document.getElementById('prog');
const score=document.getElementById('score');
const totalPill=document.getElementById('totalPill');
let order=[...Array(questions.length).keys()];

function renderItem(q,i){
  const box=document.createElement('article');
  box.className='q';box.dataset.i=i;
  const head=document.createElement('div');head.className='q-head';
  const title=document.createElement('h3');title.textContent=`${i+1}. ${q.t}`;
  const badge=document.createElement('span');badge.className='badge';badge.textContent=q.type==='mul'?'Select all that apply':'Select one';
  head.append(title,badge);
  const opts=document.createElement('div');opts.className='opts';
  const inputType=q.type==='mul'?'checkbox':'radio',name=`q_${i}`;
  q.opts.forEach((txt,o)=>{
    const row=document.createElement('label');row.className='choice';
    const inp=document.createElement('input');inp.type=inputType;inp.name=name;inp.value=o;
    inp.addEventListener('change',upd);
    const span=document.createElement('span');span.textContent=txt;
    row.append(inp,span);opts.appendChild(row);
  });
  const expl=document.createElement('div');expl.className='explain';expl.textContent=q.e||'';
  box.append(head,opts,expl);
  return box;
}

function build(){
  wrap.innerHTML='';
  const byDomain={};
  order.forEach((srcIdx,displayIdx)=>{
    const q=questions[srcIdx];
    (byDomain[q.d]=byDomain[q.d]||[]).push({q,displayIdx});
  });
  Object.keys(byDomain).forEach(dom=>{
    const sec=document.createElement('section');
    const domHead=document.createElement('div');domHead.className='domain';
    const domTitle=document.createElement('div');domTitle.className='domain-title';domTitle.textContent=dom;
    domHead.appendChild(domTitle);
    sec.appendChild(domHead);
    byDomain[dom].forEach(({q,displayIdx})=>sec.appendChild(renderItem(q,displayIdx)));
    wrap.appendChild(sec);
  });
  upd();
}

function submitAll(){
  document.querySelectorAll('.q').forEach(box=>{
    const i=+box.dataset.i;
    const q=questions[order[i]];
    const expl=box.querySelector('.explain');
    const checked=[];
    box.querySelectorAll('input:checked').forEach(c=>checked.push(+c.value));
    const correct = checked.join(',')===q.c.join(',');
    expl.classList.add('show',correct?'ok':'bad');
    box.querySelectorAll('label.choice').forEach((lb,o)=>{
      lb.style.borderColor=(q.c.includes(o)?'#86efac':'#fecaca');
      lb.style.background=(q.c.includes(o)?'rgba(240,253,244,.6)':'rgba(254,242,242,.5)');
    });
    const existing=box.querySelector('.q-head .badge');
    if(existing) existing.remove();
    const b=document.createElement('span');
    b.className='badge '+(correct?'pass':'fail');
    b.textContent=correct?'Correct':'Review';
    box.querySelector('.q-head').appendChild(b);
  });
  document.body.classList.add('done');
  upd();
}

function resetAll(){
  document.querySelectorAll('.q').forEach(box=>{
    box.querySelectorAll('input:checked').forEach(c=>c.checked=false);
    const expl=box.querySelector('.explain');expl.className='explain';
    box.querySelectorAll('.badge').forEach(b=>b.remove());
    const i=+box.dataset.i;
    const badge=document.createElement('span');badge.className='badge';
    badge.textContent=questions[order[i]].type==='mul'?'Select all that apply':'Select one';
    box.querySelector('.q-head').appendChild(badge);
    box.querySelectorAll('label.choice').forEach(lb=>{lb.style.borderColor='';lb.style.background='';});
  });
  document.body.classList.remove('done');
  upd();
}

function upd(){
  const answered=document.querySelectorAll('.q input:checked').length;
  prog.textContent=`${answered} / ${questions.length}`;
  totalPill.textContent=`${questions.length} questions`;
  let sc=0,att=0;
  document.querySelectorAll('.q').forEach(box=>{
    const i=+box.dataset.i;
    const q=questions[order[i]];
    const checked=[];
    box.querySelectorAll('input:checked').forEach(c=>checked.push(+c.value));
    if(!checked.length) return;
    att++;
    if(checked.join(',')===q.c.join(',')) sc++;
  });
  score.textContent=att?Math.round((sc/att)*100)+'%':'0%';
}

function shuffle(){
  for(let i=order.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [order[i],order[j]]=[order[j],order[i]];
  }
  build();
}

build();
</script>
