<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ServiceNow CSA Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Berkeley+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#f5f2ed;--surface:#ffffff;--ink:#141311;--muted:#6b6560;--border:#e6e1da;--accent:#b45309;--accent-soft:#fff7ed;--ok:#166534;--ok-bg:#f0fdf4;--bad:#991b1b;--bad-bg:#fef2f2;--rule:#ece8e1;--shadow:0 1px 2px rgba(20,19,17,.04),0 6px 18px rgba(20,19,17,.06);--shadow-hover:0 4px 12px rgba(20,19,17,.08),0 12px 30px rgba(20,19,17,.10)}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Geist',system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:50;background:rgba(245,242,237,.78);backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--border);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  h1{font-family:'Berkeley Mono',monospace;font-size:15px;font-weight:500;letter-spacing:-.2px;margin:0;color:var(--ink)}
  .pill{font-family:'Berkeley Mono',monospace;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:4px 10px;border-radius:999px}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button{font-family:'Geist',system-ui,sans-serif;font-size:14px;font-weight:500;background:var(--surface);color:var(--ink);border:1px solid var(--border);padding:8px 14px;border-radius:10px;cursor:pointer;transition:transform .08s ease,border-color .15s ease,box-shadow .15s ease}
  button:hover{border-color:#cbc5bd;box-shadow:var(--shadow)}
  button:active{transform:translateY(1px)}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  button.primary:hover{background:#2a2723}
  main{max-width:980px;margin:24px auto;padding:0 18px 110px}
  .domain{margin:34px 0 10px;display:flex;align-items:center;gap:12px;position:sticky;top:62px;z-index:20;background:rgba(245,242,237,.68);backdrop-filter:blur(10px);padding:10px 2px}
  .domain-title{font-family:'Berkeley Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.18px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .domain::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--rule),transparent 90%)}
  .q{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 22px 18px;margin:14px 0;box-shadow:var(--shadow);transition:box-shadow .18s ease,border-color .18s ease}
  .q:hover{box-shadow:var(--shadow-hover);border-color:#d8d3ca}
  .q-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap}
  .q h3{font-size:16px;font-weight:500;margin:0;line-height:1.45;letter-spacing:-.1px}
  .badge{font-family:'Berkeley Mono',monospace;font-size:11px;background:var(--accent-soft);color:var(--accent);border:1px solid #fed7aa;padding:4px 10px;border-radius:999px;white-space:nowrap;font-weight:500}
  .badge.pass{background:var(--ok-bg);color:var(--ok);border-color:#bbf7d0}
  .badge.fail{background:var(--bad-bg);color:var(--bad);border-color:#fecaca}
  .opts{display:grid;gap:8px}
  label.choice{display:flex;gap:12px;align-items:flex-start;background:#faf9f7;border:1px solid var(--border);padding:11px 14px;border-radius:12px;cursor:pointer;transition:background .12s ease,border-color .12s ease}
  label.choice:hover{border-color:#cbc5bd;background:#fff}
  input[type=checkbox],input[type=radio]{margin-top:3px;accent-color:var(--accent);width:17px;height:17px}
  .explain{margin-top:14px;padding:14px 16px;border-radius:12px;background:linear-gradient(180deg,#fff,#faf9f7);border:1px solid var(--border);color:#3f3b37;display:none;font-size:14.5px;line-height:1.6}
  .explain.show{display:block}
  .explain.ok{border-color:#bbf7d0;background:linear-gradient(180deg,#f0fdf4,#ecfdf5)}
  .explain.bad{border-color:#fecaca;background:linear-gradient(180deg,#fef2f2,#fff5f5);color:#7f1d1d}
  #sticky{position:fixed;left:0;right:0;bottom:0;background:rgba(245,242,237,.78);backdrop-filter:blur(14px) saturate(140%);border-top:1px solid var(--border);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;z-index:40}
  .stat{font-family:'Berkeley Mono',monospace;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:6px 12px;border-radius:10px}
  .stat strong{color:var(--ink);font-weight:600}
  .done #sticky{background:rgba(245,242,237,.92)}
  @media (max-width:640px){.q{padding:14px 16px} header{flex-direction:column;align-items:flex-start} .q-head{flex-direction:column;gap:6px} .badge{width:max-content}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>ServiceNow CSA Practice — Master Bank</h1>
    <span class="pill" id="totalPill">loading…</span>
  </div>
  <div class="controls">
    <button onclick="shuffle()">Shuffle</button>
    <button onclick="resetAll()">Reset</button>
    <button class="primary" onclick="submitAll()">Submit all</button>
  </div>
</header>

<main id="qwrap"></main>

<div id="sticky">
  <div class="stat">Progress <strong id="prog">0 / 0</strong></div>
  <div class="stat">Score <strong id="score">0%</strong></div>
  <div style="display:flex;gap:8px">
    <button onclick="submitAll()">Submit all</button>
    <button onclick="resetAll()">Reset</button>
  </div>
</div>

<script>
const questions = 
[{"num": 1, "domain": "Platform Overview and Navigation (7%)", "text": "Which of the following applications is available to ALL users by default in ServiceNow?", "type": "sng", "opts": ["Change", "Incident", "Facilities", "Self Service"], "c": [3], "e": "Self Service is the only app available to all users by default"}, {"num": 2, "domain": "Platform Overview and Navigation (7%)", "text": "Which module displays a list of tasks assigned to a user's group, but not yet assigned to an individual user?", "type": "sng", "opts": ["My Teams Work", "My Groups Work", "My Groups Tasks", "My Teams Tasks"], "c": [1], "e": ""My Groups Work" = group queue not yet assigned to an individual"}, {"num": 3, "domain": "Platform Overview and Navigation (7%)", "text": "What is the "Application Navigator" used for in ServiceNow?", "type": "sng", "opts": ["Tracking the history of record changes", "Accessing all installed applications and their modules", "Defining workflow routing logic", "Managing database table schemas"], "c": [1], "e": "Application Navigator = left sidebar with all apps/modules"}, {"num": 4, "domain": "Platform Overview and Navigation (7%)", "text": "A user wants to quickly return to a frequently used module. Which feature should they use?", "type": "sng", "opts": ["System Properties", "Favorites (starred items)", "Update Sets", "The Search bar only"], "c": [1], "e": "Favorites (star icon) = bookmarks for quick navigation"}, {"num": 5, "domain": "Platform Overview and Navigation (7%)", "text": "In Next Experience (Unified Navigation), where does a user go to set personal preferences such as time zone, language, and theme?", "type": "sng", "opts": ["System Properties > User Preferences", "User Administration > User Profile", "The Profile menu (avatar/name in the top-right)", "System Settings > Global"], "c": [2], "e": "Personal preferences live in the user profile menu"}, {"num": 6, "domain": "Platform Overview and Navigation (7%)", "text": "What is the "Service Portal" in ServiceNow?", "type": "sng", "opts": ["A consumer-friendly web interface for end users to submit requests, search knowledge, and track tickets — separate from the backend admin UI", "An admin portal for managing MID Servers and plugins", "A reporting portal for generating compliance reports", "A portal used only for change management approvals"], "c": [0], "e": "Service Portal = self-service front end for non-admin users"}, {"num": 7, "domain": "Instance Configuration (10%)", "text": "What is a "Plugin" in ServiceNow?", "type": "sng", "opts": ["An optional feature or application that can be activated via the Plugin Manager to extend platform functionality", "A third-party JavaScript library embedded in a client script", "A MID Server extension for protocol translation", "A widget added to the Service Portal"], "c": [0], "e": "Plugin = optional feature activated via Plugin Manager"}, {"num": 8, "domain": "Instance Configuration (10%)", "text": "What is the purpose of "System Properties" (sys_properties)?", "type": "sng", "opts": ["Read-only metadata about the current platform version", "Global key-value configuration settings that control platform and application behavior without code changes", "A log of all system events for audit purposes", "The definition of field types in the database dictionary"], "c": [1], "e": "System Properties = global key-value config settings"}, {"num": 9, "domain": "Instance Configuration (10%)", "text": "What is "Instance Scan" used for?", "type": "sng", "opts": ["Scanning the CMDB for stale CI records", "Automatically analyzing instance configurations to detect risk patterns and best practice violations", "Auditing user login sessions and IP addresses", "Scanning Update Set XML for conflicts before committing"], "c": [1], "e": "Instance Scan = finds risk patterns and best practice violations"}, {"num": 10, "domain": "Instance Configuration (10%)", "text": "A ServiceNow admin wants to copy the production instance's data and configuration onto a development instance. What process does this describe?", "type": "sng", "opts": ["Export/Import via Update Sets", "Instance Cloning", "Data Migration via Import Sets", "Plugin synchronization"], "c": [1], "e": "Cloning = copy prod to sub-prod instance"}, {"num": 11, "domain": "Instance Configuration (10%)", "text": "What is a "MID Server"?", "type": "sng", "opts": ["A secondary ServiceNow instance used for load balancing", "A Java application installed on a customer's on-premises network that allows the cloud instance to communicate with resources behind the firewall", "A caching layer between the browser and the ServiceNow instance", "A middleware that converts REST calls to SOAP for legacy integrations"], "c": [1], "e": "MID Server = on-prem Java agent bridging cloud to LAN"}, {"num": 12, "domain": "Instance Configuration (10%)", "text": "A ServiceNow admin wants to personalize a list by changing which columns are displayed. What feature allows this?", "type": "sng", "opts": ["Form Designer", "List Personalization (gear icon or right-click column header)", "Dictionary Override", "System Properties"], "c": [1], "e": "List Personalization = personal column display customization"}, {"num": 13, "domain": "Configuring Applications for Collaboration (20%)", "text": "In a ServiceNow list, what is the purpose of the "breadcrumb" filter at the top?", "type": "sng", "opts": ["It shows the navigation path (application > module) for quick back-navigation", "It displays the active filter conditions applied to the list and allows quick removal", "It defines which columns are shown in the list", "It indicates the update set that last modified the records"], "c": [1], "e": "Breadcrumb filter = shows active filter conditions, easy to remove"}, {"num": 14, "domain": "Configuring Applications for Collaboration (20%)", "text": "What does "grouping" records in a list do?", "type": "sng", "opts": ["Merges duplicate records into one", "Organizes list rows into collapsible sections based on a chosen field value", "Applies a mandatory permanent filter", "Exports records grouped by field to a CSV"], "c": [1], "e": "Grouping = collapses list into sections by a field value"}, {"num": 15, "domain": "Configuring Applications for Collaboration (20%)", "text": "Which of the following correctly describes a "View" on a ServiceNow form?", "type": "sng", "opts": ["A saved condition that filters which records are shown in a list", "A specific arrangement of fields on a form designed for a particular role or context", "A dashboard tab combining multiple reports", "A read-only snapshot of a record at a specific point in time"], "c": [1], "e": "View = form field arrangement for a role/context"}, {"num": 16, "domain": "Configuring Applications for Collaboration (20%)", "text": "What is a "Form Template" in ServiceNow used for?", "type": "sng", "opts": ["Designing the visual layout of a dashboard", "Pre-populating a new record's fields with saved default values to speed up data entry", "Creating a reusable workflow stage", "Defining required fields for import sets"], "c": [1], "e": "Form Template = saved field defaults to speed up record creation"}, {"num": 17, "domain": "Configuring Applications for Collaboration (20%)", "text": "What is the purpose of "Tags" in ServiceNow?", "type": "sng", "opts": ["Labels that can be applied to records to help users organize and find related records across different tables", "Labels applied to fields to mark them as mandatory", "System-defined categories used in the Service Catalog", "Metadata markers on Update Set records"], "c": [0], "e": "Tags = labels to organize/find records across tables"}, {"num": 18, "domain": "Configuring Applications for Collaboration (20%)", "text": "Which of the following best describes a Visual Task Board (VTB) in ServiceNow?", "type": "sng", "opts": ["A Kanban-style board interface for visualizing and managing tasks across lanes/stages", "A reporting dashboard that aggregates task metrics", "A form layout editor for task records", "A workflow diagram showing approval stages"], "c": [0], "e": "VTB = Kanban-style board for task visualization"}, {"num": 19, "domain": "Configuring Applications for Collaboration (20%)", "text": "What are the three types of Visual Task Boards (VTBs)? *(Choose 3)*", "type": "mul", "opts": ["Freeform boards — display any task records; members can manually add/remove cards and define lanes", "Flexible boards — filter-driven cards removed automatically when tasks no longer match; custom lanes allowed", "Guided boards — lanes correspond to field values (e.g., State) and cannot be manually edited", "Static boards — read-only snapshots of task states", "Report boards — generated from a PA indicator"], "c": [0, 1, 2], "e": "Three types: Freeform, Flexible, Guided"}, {"num": 20, "domain": "Configuring Applications for Collaboration (20%)", "text": "What is the difference between a "Report" and a "Dashboard" in ServiceNow?", "type": "sng", "opts": ["A report is a single data visualization; a dashboard aggregates multiple reports and widgets onto one page", "Reports are admin-only; dashboards are for all users", "Reports use PA indicators; dashboards use table data only", "Reports run on-demand; dashboards update automatically only"], "c": [0], "e": "Report = single viz; Dashboard = collection of reports/widgets"}, {"num": 21, "domain": "Configuring Applications for Collaboration (20%)", "text": "By default, who can see a report after it has been created?", "type": "sng", "opts": ["All users on the instance", "Only the report creator — it must be explicitly shared", "All users with the itil role", "All members of the creator's assignment group"], "c": [1], "e": "Reports are private by default; creator must share"}, {"num": 22, "domain": "Configuring Applications for Collaboration (20%)", "text": "Which report type is best for showing the proportion of open incidents by category?", "type": "sng", "opts": ["Time Series", "Gauge", "Pie/Donut chart", "Single Score"], "c": [2], "e": "Pie/Donut = proportion/distribution chart"}, {"num": 23, "domain": "Configuring Applications for Collaboration (20%)", "text": "What does "Performance Analytics" add beyond basic table reports?", "type": "sng", "opts": ["The ability to collect indicator data over time and track KPI trends historically; standard reports only show a point-in-time snapshot", "Real-time streaming from external BI tools", "AI-powered narrative summaries of trend data", "Automated export to PowerPoint"], "c": [0], "e": "PA = historical trend collection; reports are point-in-time only"}, {"num": 24, "domain": "Configuring Applications for Collaboration (20%)", "text": "What is an "Email Notification" in ServiceNow?", "type": "sng", "opts": ["An automated email triggered by a defined record event or condition and sent to specified recipients", "An inbound action that converts incoming emails into records", "A scheduled batch email report sent to all admins", "A notification sent only when a record is manually flagged"], "c": [0], "e": "Email Notification = event-driven automated email"}, {"num": 25, "domain": "Configuring Applications for Collaboration (20%)", "text": "What are "Work Notes" vs "Additional Comments" on a task record?", "type": "sng", "opts": ["Both are visible to all users including customers", "Work Notes are internal (visible to agents/groups); Additional Comments are customer-facing", "Work Notes require approval to add; Additional Comments do not", "Work Notes are sent by email automatically; Additional Comments are not"], "c": [1], "e": "Work Notes = internal; Additional Comments = customer-visible"}, {"num": 26, "domain": "Configuring Applications for Collaboration (20%)", "text": "What is the purpose of an SLA (Service Level Agreement) on a task?", "type": "sng", "opts": ["A commitment that defines time targets for response and/or resolution of a task; triggers escalations when breached", "A role required to close an incident", "A catalog item for requesting service agreements", "A business rule that runs when a task is assigned"], "c": [0], "e": "SLA = time target + escalation on breach"}, {"num": 27, "domain": "Self-Service & Automation (20%)", "text": "What is a "Knowledge Base" in ServiceNow used for? *(Choose 2)*", "type": "mul", "opts": ["Storing articles that help users and agents find solutions and answers without opening tickets", "Storing CI configuration data for the CMDB", "Reducing repeat incidents by deflecting users to self-service answers", "Automating approval routing for change requests"], "c": [], "e": ""}, {"num": 28, "domain": "Self-Service & Automation (20%)", "text": "Which role is typically required to publish a knowledge article in ServiceNow?", "type": "sng", "opts": ["admin", "knowledge or knowledge_admin", "itil", "catalog_admin"], "c": [1], "e": "knowledge or knowledge_admin role required to publish"}, {"num": 29, "domain": "Self-Service & Automation (20%)", "text": "What controls which users can see a specific Knowledge Base or Service Catalog item?", "type": "sng", "opts": ["ACL rules on the kb_knowledge table", "User Criteria", "Business Rules with role conditions", "System Properties"], "c": [1], "e": "User Criteria = visibility rules for KB and catalog items"}, {"num": 30, "domain": "Self-Service & Automation (20%)", "text": "In the Service Catalog, what is a "Catalog Item"?", "type": "sng", "opts": ["A predefined offering (e.g., new laptop, software access) that end users can request", "A configuration record containing workflow routing logic", "A report showing pending service request fulfillment status", "A role granting access to submit service requests"], "c": [0], "e": "Catalog Item = requestable offering in the service catalog"}, {"num": 31, "domain": "Self-Service & Automation (20%)", "text": "What record is created when a user submits a Service Catalog request?", "type": "sng", "opts": ["An Incident (inc)", "A Request (sc_request) containing one or more Requested Items (sc_req_item)", "A Task (task) and a Change Request (change_request)", "A Problem (problem) and a Service Request (sc_task)"], "c": [1], "e": "sc_request = parent; sc_req_item = one per catalog item ordered"}, {"num": 32, "domain": "Self-Service & Automation (20%)", "text": "Multiple Choice, Single Line Text, and Select Box are what type of elements in ServiceNow?", "type": "sng", "opts": ["Order Guides", "Request Types", "Variable Types", "Related Lists"], "c": [2], "e": "Variable Types = field types on catalog item request forms"}, {"num": 33, "domain": "Self-Service & Automation (20%)", "text": "What is an "Order Guide" in the Service Catalog?", "type": "sng", "opts": ["A bundle of related catalog items ordered together as a package", "The step-by-step help text shown when a user opens a catalog item", "The SLA definition for service fulfillment times", "The approval chain for a catalog request"], "c": [0], "e": "Order Guide = bundled catalog items ordered as a package"}, {"num": 34, "domain": "Self-Service & Automation (20%)", "text": "In Flow Designer (Workflow Studio), what is the difference between a "Flow" and a "Subflow"?", "type": "sng", "opts": ["A Flow is triggered by an event, schedule, or service catalog item; a Subflow is a reusable logic component called from within a flow or other subflows", "Flows run client-side; Subflows run server-side", "Flows are limited to one application scope; Subflows can be global", "Flows require scripting; Subflows are no-code only"], "c": [0], "e": "Flow = triggered automation; Subflow = reusable component"}, {"num": 35, "domain": "Self-Service & Automation (20%)", "text": "Which of the following can trigger a Flow Designer flow? *(Choose 2)*", "type": "mul", "opts": ["A record being created or updated", "A scheduled date/time or recurring interval", "A MID Server heartbeat event", "A plugin being activated"], "c": [], "e": ""}, {"num": 36, "domain": "Self-Service & Automation (20%)", "text": "What is Virtual Agent in ServiceNow?", "type": "sng", "opts": ["An AI-powered chatbot platform that provides user assistance through automated conversations, helping users get information and complete tasks without agent involvement", "A background automation that runs scripts on a schedule", "An agent desktop tool that suggests answers to live agents", "A testing framework for validating workflow automations"], "c": [0], "e": "Virtual Agent = AI chatbot for user self-service"}, {"num": 37, "domain": "Self-Service & Automation (20%)", "text": "Virtual Agent topics can be authored using which of the following? *(Choose 2)*", "type": "mul", "opts": ["Virtual Agent Designer (drag-and-drop graphical canvas)", "NLU (Natural Language Understanding) for intent recognition", "Import Sets to load conversation scripts from Excel", "Transform Maps to define conversation branching rules"], "c": [], "e": ""}, {"num": 38, "domain": "Self-Service & Automation (20%)", "text": "What does Virtual Agent "deflection" mean?", "type": "sng", "opts": ["Routing a ticket to a different assignment group", "Resolving a user's issue through the chatbot so that no human agent ticket is created", "Redirecting a user from the Service Portal to the backend UI", "Moving a conversation from Virtual Agent to email"], "c": [1], "e": "Deflection = user resolved by bot, no ticket needed"}, {"num": 39, "domain": "Database Management and Platform Security (30%)", "text": "In ServiceNow, what is a "Table"?", "type": "sng", "opts": ["A collection of records where each row is a record and each column is a field", "A grouping of workflow stages for a process", "A container for Update Set configuration changes", "A form layout template"], "c": [0], "e": "Table = rows (records) and columns (fields) in the database"}, {"num": 40, "domain": "Database Management and Platform Security (30%)", "text": "Which table is the parent (base) for Incident, Problem, and Change Request?", "type": "sng", "opts": ["sys_metadata", "cmdb_ci", "task", "sys_user"], "c": [2], "e": "`task` is the parent of incident, problem, change, request"}, {"num": 41, "domain": "Database Management and Platform Security (30%)", "text": "What does it mean for one table to "extend" another?", "type": "sng", "opts": ["The child table inherits all fields from the parent and can add its own unique fields", "The child table copies the parent's records on a nightly schedule", "The child table's records replace the parent's records when deployed", "The child table holds a foreign key reference to the parent's primary key only"], "c": [0], "e": "Extending = inheritance; child gets all parent fields + its own"}, {"num": 42, "domain": "Database Management and Platform Security (30%)", "text": "What is the "sys_id" of a record?", "type": "sng", "opts": ["The display name field shown in reference dropdowns", "A globally unique identifier (GUID) automatically assigned to every record in every table", "The internal name of a table", "The primary key used only on the task table"], "c": [1], "e": "sys_id = GUID assigned to every record in every table"}, {"num": 43, "domain": "Database Management and Platform Security (30%)", "text": "Which field type stores a link to a record in another table and displays that record's display value?", "type": "sng", "opts": ["String", "Integer", "Reference", "Choice"], "c": [2], "e": "Reference field = pointer to a record in another table"}, {"num": 44, "domain": "Database Management and Platform Security (30%)", "text": "What is a "Dictionary Override" used for?", "type": "sng", "opts": ["Changing the attributes of a field (e.g., making it mandatory) on an extended/child table without modifying the parent table's field definition", "Overriding an ACL rule for a specific application scope", "Renaming a table in a specific language", "Replacing a field's display value with a calculated value"], "c": [0], "e": "Dictionary Override = modify inherited field on child table only"}, {"num": 45, "domain": "Database Management and Platform Security (30%)", "text": "What is an Access Control (ACL) rule used for?", "type": "sng", "opts": ["Defining which roles can read, write, create, or delete records and fields in a table", "Encrypting data as it moves between instances", "Scheduling which users can log in during specific hours", "Controlling which fields are exported in an Update Set"], "c": [0], "e": "ACL = who can read/write/create/delete on tables or fields"}, {"num": 46, "domain": "Database Management and Platform Security (30%)", "text": "Which of the following correctly describes an ACL rule's evaluation order?", "type": "sng", "opts": ["Field-level ACLs are checked first, then record-level ACLs, then table-level ACLs", "Table-level ACLs first, then record-level, then field-level — the most specific level wins", "All ACL types are evaluated simultaneously and the first match applies", "Only one level (table, record, or field) can exist per table at a time"], "c": [1], "e": "Most specific wins: table → record → field"}, {"num": 47, "domain": "Database Management and Platform Security (30%)", "text": "What does the "admin" role grant in ServiceNow?", "type": "sng", "opts": ["Full unrestricted access to all platform features, tables, and configuration; admins can override ACLs", "Read-only access to all tables for auditing purposes", "Permission to manage user accounts and groups only", "Access limited to the Service Portal and self-service modules"], "c": [0], "e": "admin = full platform access, can override ACLs"}, {"num": 48, "domain": "Database Management and Platform Security (30%)", "text": "How are roles typically granted to users? *(Choose 2)*", "type": "mul", "opts": ["Assigned directly on the user's record", "Inherited through membership in a group that has the role assigned", "Automatically assigned based on the user's department field value", "Deployed by running an Update Set on the production instance"], "c": [], "e": ""}, {"num": 49, "do esce = match key to prevent duplicate imports"}, {"num": 53, "domain": "Database Management and Platform Security (30%)", "text": "What is the CMDB (Configuration Management Database) used for in ServiceNow?", "type": "sng", "opts": ["Storing and managing configuration items (CIs) and their relationships to support IT service management", "Staging imported data before transformation", "Archiving closed incident records for compliance", "Storing Update Set deployment history"], "c": [0], "e": "CMDB = authoritative CI inventory + relationships"}, {"num": 54, "domain": "Database Management and Platform Security (30%)", "text": "Which of the following are examples of CI classes in the CMDB? *(Choose 2)*", "type": "mul", "opts": ["cmdb_ci_server (Server)", "sys_user (User)", "cmdb_ci_appl (Application)", "sc_request (Service Catalog Request)"], "c": [], "e": ""}, {"num": 55, "domain": "Database Management and Platform Security (30%)", "text": "What is the "Common Service Data Model" (CSDM) in ServiceNow?", "type": "sng", "opts": ["A standard framework and data model that defines how business services, technical services, and CIs relate to each other across the CMDB", "A plugin for importing external customer data into the CMDB", "A reporting model for service desk KPIs", "A data schema for the Service Catalog variables"], "c": [0], "e": "CSDM = standard model defining how services and CIs relate"}, {"num": 56, "domain": "Database Management and Platform Security (30%)", "text": "What is the "Security Center" (formerly Instance Security Center) used for?", "type": "sng", "opts": ["A consolidated dashboard for monitoring instance security compliance, viewing security events, configuring hardening settings, and managing user sessions", "A marketplace for approved security plugins", "A tool for scanning Update Sets for malicious scripts before commit", "A report generator for PCI audit evidence"], "c": [0], "e": "Security Center = compliance + events + hardening + sessions"}, {"num": 57, "domain": "Database Management and Platform Security (30%)", "text": "What is the "Daily Compliance Score" in the Security Center?", "type": "sng", "opts": ["A percentage score indicating how compliant the instance's security property settings are with recommended hardening guidelines", "A count of failed login attempts in the last 24 hours", "The percentage of incidents resolved within SLA in the past day", "A daily export of the instance's ACL configuration to a compliance team"], "c": [0], "e": "Daily Compliance Score = % of hardening properties correctly configured"}, {"num": 58, "domain": "Database Management and Platform Security (30%)", "text": "What does the "Shared Responsibility Model" mean in the context of ServiceNow cloud security?", "type": "sng", "opts": ["ServiceNow is responsible for the security of the cloud infrastructure; the customer is responsible for configuring and securing their instance (data, access controls, integrations, customizations)", "ServiceNow and the customer share equal responsibility for all security decisions", "The customer is fully responsible for all security, including the underlying cloud infrastructure", "ServiceNow handles all instance security automatically; no customer action is required"], "c": [0], "e": "ServiceNow secures the platform; customer secures their instance"}, {"num": 59, "domain": "Data Migration and Integration (13%)", "text": "What is the scripting language used in ServiceNow?", "type": "sng", "opts": ["Java", "AngularJS", "JavaScript", "Jelly"], "c": [2], "e": "JavaScript is the scripting language in ServiceNow (official blueprint sample Q5)"}, {"num": 60, "domain": "Data Migration and Integration (13%)", "text": "What is a "Business Rule" in ServiceNow?", "type": "sng", "opts": ["A server-side script that runs when a record is displayed, inserted, updated, or deleted, or when a table is queried", "A client-side script that validates fields before form submission", "A scheduled job that runs on a defined interval", "A configuration record that defines escalation paths"], "c": [0], "e": "Business Rule = server-side script on record events"}, {"num": 61, "domain": "Data Migration and Integration (13%)", "text": "A Business Rule is configured with "When = before" and "Insert = true". When does this rule execute?", "type": "sng", "opts": ["Before the form is displayed to the user", "After the user submits the form and after the record is saved to the database", "After the user submits the form but before the record is saved to the database", "Only when triggered manually by a script"], "c": [2], "e": ""Before" = after form submit but BEFORE database write"}, {"num": 62, "domain": "Data Migration and Integration (13%)", "text": "Which of the following are valid "When" settings for a Business Rule? *(Choose 2)*", "type": "mul", "opts": ["Before", "Inline", "After", "On Submit"], "c": [], "e": ""}, {"num": 63, "domain": "Data Migration and Integration (13%)", "text": "What global variable in a Business Rule refers to the current state of the record being acted upon?", "type": "sng", "opts": ["`g_form`", "`gs`", "`current`", "`previous`"], "c": [2], "e": "`current` = the record being processed right now"}, {"num": 64, "domain": "Data Migration and Integration (13%)", "text": "What does the global variable `previous` refer to in a Business Rule?", "type": "sng", "opts": ["The state of the record before any updates made in the current transaction — available on update and delete operations only", "The record that was last saved by any user", "The parent record of the current record", "The prior version of the business rule script"], "c": [0], "e": "`previous` = state before the current transaction (update/delete only)"}, {"num": 65, "domain": "Data Migration and Integration (13%)", "text": "What is a "UI Policy" in ServiceNow?", "type": "sng", "opts": ["A server-side rule that enforces mandatory fields at the database level regardless of access method", "A no-code configuration that dynamically controls form field behavior (mandatory, read-only, hidden) based on conditions in the browser", "A policy that defines which users can access a specific module", "A visual theme setting for the Service Portal"], "c": [1], "e": "UI Policy = no-code, browser-side field behavior control"}, {"num": 66, "domain": "Data Migration and Integration (13%)", "text": "What is the key difference between a "UI Policy" and a "Data Policy"?", "type": "sng", "opts": ["UI Policies apply only in the browser (forms); Data Policies enforce field rules at the database level and apply regardless of access method (forms, APIs, imports)", "UI Policies are server-side; Data Policies are client-side", "UI Policies apply to all tables; Data Policies apply only to custom tables", "UI Policies set field visibility; Data Policies set record-level security"], "c": [0], "e": "UI Policy = browser only; Data Policy = database-level, all access methods"}, {"num": 67, "domain": "Data Migration and Integration (13%)", "text": "In which state must an Update Set be before it can be exported from a source instance?", "type": "sng", "opts": ["In Progress", "Ignored", "Complete", "Committed"], "c": [2], "e": "Must be "Complete" before export/retrieve"}, {"num": 68, "domain": "Data Migration and Integration (13%)", "text": "What is the correct order of steps for moving a completed Update Set from Instance A to Instance B?", "type": "sng", "opts": ["Export from A → Preview in B → Commit in B → Import into B", "Export from A → Import (or Retrieve) into B → Preview in B → Commit in B", "Commit in A → Export from A → Import into B → Preview in B", "Import into B → Export from A → Preview in B → Commit in B"], "c": [1], "e": "Export → Import → **Preview** → Commit (never skip Preview)"}, {"num": 69, "domain": "Data Migration and Integration (13%)", "text": "Which of the following record types are automatically captured by an Update Set? *(Choose 2)*", "type": "mul", "opts": ["Business Rules", "Incident records (actual ticket data)", "UI Policies", "User password records"], "c": [], "e": ""}, {"num": 70, "domain": "Data Migration and Integration (13%)", "text": "What is a "Script Include" in ServiceNow?", "type": "sng", "opts": ["A reusable server-side JavaScript library that can be called from business rules, client scripts (via GlideAjax), and other server-side scripts", "A tag that embeds an external JavaScript file into a form", "A client-side script that runs on every page load", "A scheduled script that executes daily"], "c": [0], "e": "Script Include = reusable server-side JS library"}];
let order = questions.map((_,i)=>i);
function upd(){const answered=document.querySelectorAll('.q input:checked').length;prog.textContent=answered + ' / ' + questions.length;totalPill.textContent=questions.length + ' questions';let sc=0,att=0;document.querySelectorAll('.q').forEach(box=>{const i=+box.dataset.i;const q=questions[order[i]];const checked=[];box.querySelectorAll('input:checked').forEach(c=>checked.push(+c.value));if(!checked.length) return;att++;if(checked.join(',')===q.c.join(',')) sc++;});score.textContent=att?Math.round((sc/att)*100)+'%':'0%';}
function render(){qwrap.innerHTML='';const seen=new Set();order.forEach((oi,idx)=>{const q=questions[oi];if(seen.has(q.t)) return;seen.add(q.t);const box=document.createElement('div');box.className='q';box.dataset.i=idx;box.dataset.idx=oi;const head=document.createElement('div');head.className='q-head';const title=document.createElement('h3');title.textContent=(idx+1)+'. '+q.t;head.appendChild(title);const badge=document.createElement('span');badge.className='badge';badge.textContent=q.type==='mul'?'Select all that apply':'Select one';head.appendChild(badge);box.appendChild(head);const opts=document.createElement('div');opts.className='opts';q.opts.forEach((o,oi2)=>{const lbl=document.createElement('label');lbl.className='choice';const inp=document.createElement('input');inp.type=q.type==='mul'?'checkbox':'radio';inp.name='q'+idx;inp.value=oi2;inp.addEventListener('change',()=>{upd();});lbl.appendChild(inp);const span=document.createElement('span');span.textContent=(String.fromCharCode(65+oi2))+'. '+o;lbl.appendChild(span);opts.appendChild(lbl);});box.appendChild(opts);const expl=document.createElement('div');expl.className='explain';expl.innerHTML='<strong>Answer:</strong> ' + ((q.c.map(i=>String.fromCharCode(65+i)).join(', ')) || '—') + '<br/><strong>Explanation:</strong> ' + (q.e||'—');box.appendChild(expl);qwrap.appendChild(box);});upd();}
function submitAll(){document.body.classList.add('done');let sc=0;document.querySelectorAll('.q').forEach(box=>{const i=+box.dataset.i;const q=questions[order[i]];const checked=[];box.querySelectorAll('input:checked').forEach(c=>checked.push(+c.value));const correct=checked.join(',')===q.c.join(',');if(correct) sc++;const badge=box.querySelector('.badge');badge.className='badge '+(correct?'pass':'fail');badge.textContent=correct?'Correct':'Incorrect';const expl=box.querySelector('.explain');expl.classList.add('show',correct?'ok':'bad');});const totalPillEl=document.getElementById('totalPill');totalPillEl.textContent=sc+' / '+questions.length + ' passed';let txt=sc+' / '+questions.length+'\n';document.querySelectorAll('.q').forEach((box,idx)=>{const i=+box.dataset.i;const q=questions[order[i]];const checked=[];box.querySelectorAll('input:checked').forEach(c=>checked.push(+c.value));const correct=checked.join(',')===q.c.join(',');txt+=(idx+1)+'. ' + (correct?'✔':'✖') + '\n';});try{const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);alert('Score copied to clipboard');}catch(e){alert('Score: '+sc+'/'+questions.length);}}
function resetAll(){document.querySelectorAll('.q').forEach(box=>{box.querySelectorAll('input:checked').forEach(c=>c.checked=false);const expl=box.querySelector('.explain');expl.className='explain';box.querySelectorAll('.badge').forEach(b=>b.remove());const i=+box.dataset.i;const badge=document.createElement('span');badge.className='badge';badge.textContent=questions[order[i]].type==='mul'?'Select all that apply':'Select one';box.querySelector('.q-head').appendChild(badge);box.querySelectorAll('label.choice').forEach(lb=>{lb.style.borderColor='';lb.style.background='';});});document.body.classList.remove('done');upd();}
function shuffle(){order=order.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.x);render();}
render();
