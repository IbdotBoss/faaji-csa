    const row=document.createElement('label');row.className='choice';
    const inp=document.createElement('input');inp.type=inputType;inp.name=name;inp.value=o;
    inp.addEventListener('change',upd);
    const span=document.createElement('span');span.textContent=txt;
    row.append(inp,span);opts.appendChild(row);
  });
  const expl=document.createElement('div');expl.className='explain';expl.textContent=q.e||'';
  box.append(head,opts,expl);
  return box;
}

function build(){
  wrap.innerHTML='';
  const byDomain={};
  order.forEach((srcIdx,displayIdx)=>{
    const q=questions[srcIdx];
    (byDomain[q.d]=byDomain[q.d]||[]).push({q,displayIdx});
  });
  Object.keys(byDomain).forEach(dom=>{
    const sec=document.createElement('section');
    const domHead=document.createElement('div');domHead.className='domain';
    const domTitle=document.createElement('div');domTitle.className='domain-title';domTitle.textContent=dom;
    domHead.appendChild(domTitle);
    sec.appendChild(domHead);
    byDomain[dom].forEach(({q,displayIdx})=>sec.appendChild(renderItem(q,displayIdx)));
    wrap.appendChild(sec);
  });
  upd();
}

function submitAll(){
  document.querySelectorAll('.q').forEach(box=>{
    const i=+box.dataset.i;
    const q=questions[order[i]];
    const expl=box.querySelector('.explain');
    const checked=[];
    box.querySelectorAll('input:checked').forEach(c=>checked.push(+c.value));
    const correct = checked.join(',')===q.c.join(',');
    expl.classList.add('show',correct?'ok':'bad');
    box.querySelectorAll('label.choice').forEach((lb,o)=>{
      lb.style.borderColor=(q.c.includes(o)?'#86efac':'#fecaca');
      lb.style.background=(q.c.includes(o)?'rgba(240,253,244,.6)':'rgba(254,242,242,.5)');
    });
    const existing=box.querySelector('.q-head .badge');
    if(existing) existing.remove();
    const b=document.createElement('span');
    b.className='badge '+(correct?'pass':'fail');
    b.textContent=correct?'Correct':'Review';
    box.querySelector('.q-head').appendChild(b);
  });
  document.body.classList.add('done');
  upd();
}

function resetAll(){
  document.querySelectorAll('.q').forEach(box=>{
    box.querySelectorAll('input:checked').forEach(c=>c.checked=false);
    const expl=box.querySelector('.explain');expl.className='explain';
    box.querySelectorAll('.badge').forEach(b=>b.remove());
    const i=+box.dataset.i;
    const badge=document.createElement('span');badge.className='badge';
    badge.textContent=questions[order[i]].type==='mul'?'Select all that apply':'Select one';
    box.querySelector('.q-head').appendChild(badge);
    box.querySelectorAll('label.choice').forEach(lb=>{lb.style.borderColor='';lb.style.background='';});
  });
  document.body.classList.remove('done');
  upd();
}

function upd(){
  const answered=document.querySelectorAll('.q input:checked').length;
  prog.textContent=`${answered} / ${questions.length}`;
  totalPill.textContent=`${questions.length} questions`;
  let sc=0,att=0;
  document.querySelectorAll('.q').forEach(box=>{
    const i=+box.dataset.i;
    const q=questions[order[i]];
    const checked=[];
    box.querySelectorAll('input:checked').forEach(c=>checked.push(+c.value));
    if(!checked.length) return;
    att++;
    if(checked.join(',')===q.c.join(',')) sc++;
  });
  score.textContent=att?Math.round((sc/att)*100)+'%':'0%';
}

function shuffle(){
  for(let i=order.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [order[i],order[j]]=[order[j],order[i]];
  }
  build();
}

build();
</script>
</body>
